<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WXL-E | Digital Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ff41; --bg: #050505; --panel: #0f0f0f; }
        body { background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin:0; }
        .glitch-title { font-family: 'Orbitron'; font-size: 3rem; text-align: center; color: var(--neon); text-shadow: 0 0 15px var(--neon); margin: 30px 0; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        
        .status-card {
            background: var(--panel); border: 1px solid var(--neon); border-radius: 15px;
            padding: 30px; text-align: center; margin-bottom: 40px; box-shadow: 0 0 20px rgba(0,255,65,0.1);
        }
        .points-val { font-family: 'Orbitron'; font-size: 4rem; color: var(--neon); display: block; }
        
        input { background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 25px; width: 80%; max-width: 350px; text-align: center; margin: 15px 0; }
        .btn-glow { background: var(--neon); color: #000; padding: 12px 30px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-glow:hover { box-shadow: 0 0 20px var(--neon); transform: translateY(-2px); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .item-card { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid #222; text-align: center; transition: 0.3s; }
        .item-card:hover { border-color: var(--neon); }
        .price-tag { color: var(--neon); font-family: 'Orbitron'; display: block; margin: 10px 0; }

        footer { text-align: center; padding: 50px; border-top: 1px solid #111; margin-top: 50px; }
        .dev-link { color: var(--neon); text-decoration: none; font-family: 'Orbitron'; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="glitch-title">WXL-E SYSTEM</h1>

    <div class="status-card">
        <span style="font-size: 0.9rem; color: #888;">CURRENT BALANCE</span>
        <span id="pDisp" class="points-val">0</span>
        
        <input type="email" id="uEmail" placeholder="ENTER YOUR EMAIL">
        <br>
        <button class="btn-glow" onclick="sync()">SYNC & REFRESH</button>

        <div id="refSection" style="display:none; margin-top: 20px; padding: 10px; background: #000; border-radius: 10px;">
            <p style="font-size: 0.8rem; color: #555;">SHARE THIS LINK TO GET +5 POINTS:</p>
            <code id="refLink" style="color: var(--neon); word-break: break-all;"></code>
        </div>
    </div>

    <h2 style="color: var(--neon); margin-bottom: 25px;">AVAILABLE ASSETS</h2>
    <div class="grid" id="shop"></div>
</div>

<footer>
    <p>DEVELOPED BY: <a href="https://t.me/wxl_e" class="dev-link">@wxl_e</a></p>
</footer>

<script>
    // هام جداً: ضع رابط Render الخاص بك هنا
    const API_BASE = "https://wxl-e-store.onrender.com"; 

    const products = [
        {id:1, n:"solx_wxle Framework", p:150},
        {id:2, n:"RSS.DDOS.V3", p:120},
        {id:3, n:"CyberShield Toolkit", p:100},
        {id:6, n:"Zero-Day Exploit Course", p:500},
        {id:7, n:"Trading Academy Pro", p:400},
        {id:5, n:"IPGRAM Extractor", p:60}
    ];

    const shop = document.getElementById('shop');
    products.forEach(x => {
        shop.innerHTML += `
            <div class="item-card">
                <h3>${x.n}</h3>
                <span class="price-tag">${x.p} PTS</span>
                <button class="btn-glow" style="width:100%" onclick="buy(${x.id})">PURCHASE</button>
            </div>
        `;
    });

    async function sync() {
        const email = document.getElementById('uEmail').value;
        const ref = new URLSearchParams(window.location.search).get('ref');
        if(!email) return alert("Enter Email!");

        try {
            const r = await fetch(`${API_BASE}/api/sync`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, ref_by: ref})
            });
            const d = await r.json();
            document.getElementById('pDisp').innerText = d.points;
            document.getElementById('refLink').innerText = window.location.origin + window.location.pathname + "?ref=" + d.ref;
            document.getElementById('refSection').style.display = "block";
            alert("Data Synced Successfully!");
        } catch(e) { alert("Server Connection Failed!"); }
    }

    async function buy(id) {
        const email = document.getElementById('uEmail').value;
        if(!email) return alert("Login first!");

        const r = await fetch(`${API_BASE}/api/buy`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, p_id: id})
        });
        const d = await r.json();
        if(d.success) alert("SUCCESS! Product Key: " + d.data);
        else alert("ERROR: " + d.msg);
    }
</script>
</body>
</html>
