<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WXL-E | Ultimate Elite Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #00ff41; --bg: #030303; --card: #0d0d0d; }
        body { background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin:0; scroll-behavior: smooth; }
        .glitch { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; color: var(--p); text-shadow: 0 0 20px var(--p); text-align: center; margin: 40px 0; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        
        .hero-stats {
            background: var(--card); border: 2px solid var(--p); border-radius: 20px;
            padding: 40px; text-align: center; box-shadow: 0 0 30px rgba(0,255,65,0.15);
            margin-bottom: 60px; transform: perspective(1000px) rotateX(2deg);
        }
        .points-box { font-size: 5rem; font-family: 'Orbitron'; color: var(--p); text-shadow: 0 0 10px var(--p); }
        
        .input-group { margin: 20px 0; }
        input { background: #000; border: 1px solid #333; color: var(--p); padding: 15px 25px; border-radius: 50px; width: 300px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--p); box-shadow: 0 0 15px var(--p); }
        
        .btn { background: var(--p); color: #000; font-weight: 900; padding: 15px 40px; border-radius: 50px; border: none; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn:hover { transform: scale(1.1); box-shadow: 0 0 25px var(--p); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .card { background: var(--card); border-radius: 15px; padding: 30px; border: 1px solid #1a1a1a; transition: 0.4s; position: relative; overflow: hidden; }
        .card:hover { border-color: var(--p); transform: translateY(-10px); }
        .tag { position: absolute; top: 10px; right: 10px; background: var(--p); color: #000; font-size: 10px; padding: 2px 8px; border-radius: 5px; font-weight: bold; }
        
        .price { font-family: 'Orbitron'; font-size: 1.5rem; color: var(--p); margin: 15px 0; display: block; }
        
        footer { text-align: center; padding: 100px 20px; border-top: 1px solid #111; margin-top: 50px; }
        .contact { color: var(--p); text-decoration: none; font-size: 1.5rem; font-family: 'Orbitron'; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="glitch">WXL-E SYSTEM</h1>

    <div class="hero-stats">
        <span style="color: #888; letter-spacing: 2px;">YOUR BALANCE</span>
        <div class="points-box" id="pDisplay">000</div>
        <div class="input-group">
            <input type="email" id="email" placeholder="ENTER YOUR EMAIL">
            <button class="btn" onclick="sync()">SYNC DATA</button>
        </div>
        <div id="refContainer" style="display:none; margin-top: 20px; background: #000; padding: 10px; border-radius: 10px;">
            <p style="font-size: 12px; color: #555;">REFERRAL LINK (5 POINTS PER INVITE):</p>
            <span id="refLink" style="color: var(--p); font-size: 14px;"></span>
        </div>
    </div>

    <h2 style="color: var(--p); border-left: 5px solid var(--p); padding-left: 15px; margin-bottom: 30px;">PREMIUM ASSETS</h2>
    <div class="grid" id="productGrid">
        </div>
</div>

<footer>
    <p>FOR CUSTOM ORDERS & SUPPORT:</p>
    <a href="https://t.me/wxl_e" class="contact">@wxl_e</a>
    <p style="margin-top: 20px; font-size: 12px; color: #333;">POWERED BY WXL-E LEGENDARY SEC. 2026</p>
</footer>

<script>
    const API = "https://your-app.onrender.com"; // ضع رابط RENDER هنا
    const products = [
        {id:1, name: "solx_wxle Framework", price: 150, cat: "Tool"},
        {id:2, name: "RSS.DDOS.V3", price: 120, cat: "Tool"},
        {id:3, name: "CyberShield Toolkit", price: 100, cat: "Tool"},
        {id:6, name: "Zero-Day Exploit Course", price: 500, cat: "Course"},
        {id:7, name: "Trading Academy Pro", price: 400, cat: "Course"},
        {id:5, name: "IPGRAM Extractor", price: 60, cat: "Tool"}
    ];

    // رسم المنتجات
    const grid = document.getElementById('productGrid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="card">
                <span class="tag">${p.cat}</span>
                <h3>${p.name}</h3>
                <span class="price">${p.price} PTS</span>
                <button class="btn" style="width:100%" onclick="buy(${p.id})">BUY NOW</button>
            </div>
        `;
    });

    async function sync() {
        const email = document.getElementById('email').value;
        const ref = new URLSearchParams(window.location.search).get('ref');
        if(!email) return alert("Email Required!");

        const res = await fetch(`${API}/api/sync`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, ref_by: ref})
        });
        const data = await res.json();
        document.getElementById('pDisplay').innerText = data.points;
        document.getElementById('refLink').innerText = window.location.origin + window.location.pathname + "?ref=" + data.ref;
        document.getElementById('refContainer').style.display = "block";
    }

    async function buy(pid) {
        const email = document.getElementById('email').value;
        if(!email) return alert("Sync your email first!");
        
        const res = await fetch(`${API}/api/buy`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, p_id: pid})
        });
        const data = await res.json();
        if(data.success) alert("PURCHASED! Your Key: " + data.data);
        else alert(data.msg);
    }
</script>
</body>
</html>
