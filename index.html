<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WXL-E | Digital Elite Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --deep-black: #050505;
            --glass-bg: rgba(20, 20, 20, 0.8);
            --accent-red: #ff003c;
        }

        body {
            font-family: 'Cairo', 'Orbitron', sans-serif;
            background-color: var(--deep-black);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* خلفية متحركة خفيفة */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            z-index: -1;
        }

        header {
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #000, transparent);
            animation: fadeInDown 1s ease;
        }

        .neon-text {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 5px;
        }

        .container { max-width: 1200px; margin: auto; padding: 20px; }

        /* لوحة المستخدم المتطورة */
        .user-dashboard {
            background: var(--glass-bg);
            border: 1px solid var(--neon-green);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 50px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
        }

        .stat-box { text-align: center; }
        .stat-value { font-size: 2rem; color: var(--neon-green); font-weight: bold; display: block; }
        .stat-label { font-size: 0.9rem; color: #888; }

        /* المنتجات */
        .section-title {
            font-size: 1.8rem;
            margin: 40px 0 25px;
            border-right: 5px solid var(--neon-green);
            padding-right: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .card:hover {
            transform: scale(1.05);
            border-color: var(--neon-green);
            box-shadow: 0 10px 30px rgba(0, 255, 65, 0.2);
        }

        .btn-buy {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-buy:hover {
            background: var(--neon-green);
            color: #000;
        }

        /* الحقوق والتواصل */
        footer {
            text-align: center;
            padding: 50px;
            margin-top: 100px;
            background: #000;
            border-top: 1px solid #222;
        }

        .contact-link {
            color: var(--neon-green);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header>
    <h1 class="neon-text">WXL-E SYSTEM</h1>
    <p>الجيل القادم من الخدمات الرقمية والأدوات البرمجية</p>
</header>

<div class="container">
    
    <div class="user-dashboard">
        <div class="stat-box">
            <span id="pointsValue" class="stat-value">0</span>
            <span class="stat-label">نقاطك الحالية</span>
        </div>
        
        <div class="stat-box" style="flex-grow: 1; max-width: 500px;">
            <input type="email" id="userEmail" placeholder="أدخل إيميلك للبدء..." style="width:80%; padding:10px; background:#000; border:1px solid #444; color:#fff;">
            <button onclick="initAccount()" style="padding:10px 20px; background:var(--neon-green); border:none; cursor:pointer;">دخول</button>
            <p id="refLink" style="font-size:0.8rem; margin-top:10px; color:var(--neon-green);"></p>
        </div>

        <div class="stat-box">
            <a href="https://t.me/wxl_e" class="contact-link">Contact: @wxl_e</a>
        </div>
    </div>

    <h2 class="section-title">الأدوات الاحترافية (V.IP)</h2>
    <div class="grid">
        <div class="card">
            <h3>Solx-X Recon</h3>
            <p>أداة الاستطلاع الذاتي الأقوى.</p>
            <span style="color:var(--neon-green)">150 نقطة</span>
            <button class="btn-buy" onclick="purchase(1)">شراء سريع</button>
        </div>
        <div class="card">
            <h3>RSS DDoS V3</h3>
            <p>اختبار ضغط السيرفرات المتقدم.</p>
            <span style="color:var(--neon-green)">120 نقطة</span>
            <button class="btn-buy" onclick="purchase(2)">شراء سريع</button>
        </div>
    </div>

</div>

<footer>
    <p>© جميع الحقوق محفوظة لـ <span style="color:var(--neon-green)">WXL-E SERVICES</span></p>
    <p>للتواصل والدعم: <a href="https://t.me/wxl_e" style="color:#fff;">@wxl_e</a></p>
</footer>

<script>
    // عند تحميل الصفحة، نتحقق من وجود "كود دعوة" في الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const refFromUrl = urlParams.get('ref');

    async function initAccount() {
        const email = document.getElementById('userEmail').value;
        if(!email) return alert("أدخل الإيميل أولاً");

        // استبدل هذا الرابط برابط سيرفر Render الخاص بك
        const API_URL = "https://your-render-app.onrender.com/api/register";

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, ref_by: refFromUrl })
            });
            const data = await response.json();
            
            // تحديث النقاط ورابط الدعوة في الشاشة
            document.getElementById('pointsValue').innerText = data.points;
            const myRefLink = `${window.location.origin}${window.location.pathname}?ref=${data.referral_code}`;
            document.getElementById('refLink').innerText = "رابط دعوتك: " + myRefLink;
            
            alert("تم تسجيل دخولك بنجاح!");
        } catch (e) {
            alert("حدث خطأ في الاتصال بالسيرفر");
        }
    }

    function purchase(id) {
        alert("سيتم التحقق من نقاطك.. يرجى التأكد من تسجيل الدخول أولاً.");
    }
</script>

</body>
</html>
