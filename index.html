<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL-X | @WXL_E</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ff41; --bg: #020202; }
        body { background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .sentinel-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid var(--neon); border-radius: 20px;
            padding: 25px; width: 320px; margin: 20px auto; position: relative;
        }
        .pin-box { color: #ff003c; font-weight: bold; font-family: 'Orbitron'; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 12px; overflow: hidden; text-align: center; padding: 15px; }
        .main-btn { background: var(--neon); color: #000; padding: 12px; border: none; border-radius: 6px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 10px; font-family: 'Cairo'; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; }
        .modal-content { background: #0d0d0d; width: 85%; max-width: 380px; margin: 60px auto; padding: 25px; border: 1px solid var(--neon); border-radius: 15px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align: center;">
        <h1 style="font-family: 'Orbitron';">SENTINEL<span style="color: var(--neon);">-X</span></h1>
        <p style="color: #888;">DEVELOPED BY @WXL_E</p>
    </header>

    <div class="sentinel-card">
        <div style="font-family: 'Orbitron'; font-size: 0.8rem; color: var(--neon);">CARD HOLDER: <span id="cardEmail" style="color:#fff"></span></div>
        <div style="margin: 15px 0;">
            <small style="color:#666">SECURITY PIN (مهم للشراء)</small><br>
            <span id="cardPIN" class="pin-box"></span>
        </div>
        <div style="font-size: 2.5rem; font-weight: 900; text-align: center;" id="cardPoints">0</div>
        <center><small style="color: var(--neon);">CREDITS</small></center>
    </div>

    <div class="grid" id="productGrid"></div>
</div>

<div id="paymentModal" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--neon);">تأكيد الدفع والاستلام</h3>
        <input type="text" id="botToken" placeholder="Bot Token">
        <input type="text" id="chatID" placeholder="Chat ID">
        <input type="password" id="checkPIN" placeholder="أدخل PIN البطاقة (الأحمر)">
        <button class="main-btn" id="finalBuyBtn">شراء وإرسال الملف فوراً</button>
        <button onclick="closeModal()" style="background:none; color:#555; border:none; cursor:pointer; margin-top:10px;">إلغاء</button>
    </div>
</div>

<script>
    let user = JSON.parse(localStorage.getItem('sentinel_v5')) || {
        email: (prompt("أدخل إيميلك:") || "GUEST").toUpperCase(),
        pin: Math.floor(1000 + Math.random() * 9000),
        points: 500, daily: 0
    };
    localStorage.setItem('sentinel_v5', JSON.stringify(user));

    function updateUI() {
        document.getElementById('cardEmail').innerText = user.email;
        document.getElementById('cardPIN').innerText = user.pin;
        document.getElementById('cardPoints').innerText = user.points;
    }

    // هنا تضع روابط الملفات الحقيقية المرفوعة على GitHub Raw مثلاً
    const products = [
        {id:1, name:"IPGRAM.py", price:100, fileUrl:"https://raw.githubusercontent.com/YourUser/YourRepo/main/IPGRAM.py"},
        {id:2, name:"solx_wxle.py", price:250, fileUrl:"https://raw.githubusercontent.com/YourUser/YourRepo/main/solx_wxle.py"},
        {id:3, name:"RSS.DDOS.V3.py", price:150, fileUrl:"https://raw.githubusercontent.com/YourUser/YourRepo/main/RSS.DDOS.V3.py"},
        {id:4, name:"كورس الاختراق", price:400, fileUrl:"https://your-link.com/hacking-course.zip"}
    ];

    let activeP = null;
    function openBuy(id) {
        activeP = products.find(p => p.id === id);
        if(user.points < activeP.price) return alert("نقاطك لا تكفي!");
        document.getElementById('paymentModal').style.display = "block";
    }

    function closeModal() { document.getElementById('paymentModal').style.display = "none"; }

    document.getElementById('finalBuyBtn').onclick = async function() {
        const pin = document.getElementById('checkPIN').value;
        const token = document.getElementById('botToken').value;
        const cid = document.getElementById('chatID').value;
        
        if(pin != user.pin) return alert("PIN خاطئ!");

        user.points -= activeP.price;
        localStorage.setItem('sentinel_v5', JSON.stringify(user));
        updateUI();

        // التعديل السحري: إرسال الملف كـ Document وليس كرسالة نصية
        const sendFileUrl = `https://api.telegram.org/bot${token}/sendDocument`;
        
        try {
            const response = await fetch(sendFileUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: cid,
                    document: activeP.fileUrl,
                    caption: `🔥 تم شراء ملف جاهز من SENTINEL-X\n📦 المنتج: ${activeP.name}\n👤 المشتري: ${user.email}\nحقوق المطور: @WXL_E`
                })
            });

            const result = await response.json();
            if(result.ok) {
                alert("✅ مبروك! الملف وصلك الآن في البوت كملف جاهز للتشغيل.");
                closeModal();
            } else {
                alert("خطأ: تأكد من أن رابط الملف مباشر وصحيح.");
            }
        } catch(e) { alert("خطأ في الاتصال بالبوت."); }
    }

    const grid = document.getElementById('productGrid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="product-card">
                <h3>${p.name}</h3>
                <div style="color:var(--neon)">${p.price} PTS</div>
                <button class="main-btn" onclick="openBuy(${p.id})">شراء واستلام الملف</button>
            </div>`;
    });

    updateUI();
</script>
</body>
</html>
