<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL-X | BY @WXL_E</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ff41; --bg: #020202; }
        body { background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,255,65,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,65,0.03) 1px, transparent 1px); background-size: 30px 30px; z-index: -1; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }

        /* البطاقة الرقمية المحدثة */
        .sentinel-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 65, 0.4); border-radius: 20px;
            padding: 25px; width: 340px; margin: 20px auto; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: left;
        }
        .rank-badge { position: absolute; top: 15px; left: 15px; background: var(--neon); color: #000; padding: 2px 10px; border-radius: 5px; font-weight: 900; font-size: 0.65rem; font-family: 'Orbitron'; }
        .card-number { font-family: 'Orbitron'; font-size: 1rem; letter-spacing: 2px; margin-top: 45px; display: block; color: var(--neon); }
        .card-details { display: flex; justify-content: space-between; margin-top: 20px; font-family: 'Orbitron'; font-size: 0.75rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
        .pin-box { color: #ff003c; font-weight: bold; font-size: 0.9rem; letter-spacing: 2px; }
        .points-display { font-size: 2.8rem; font-weight: 900; color: #fff; text-align: center; margin: 10px 0; font-family: 'Orbitron'; text-shadow: 0 0 15px var(--neon); }

        /* المتجر */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .product-card { background: #0a0a0a; border-radius: 12px; border: 1px solid #1a1a1a; overflow: hidden; transition: 0.3s; }
        .product-card:hover { border-color: var(--neon); transform: scale(1.02); }
        .product-image { width: 100%; height: 150px; object-fit: cover; }
        .info { padding: 15px; text-align: center; }
        
        .main-btn { background: var(--neon); color: #000; padding: 12px; border: none; border-radius: 6px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 10px; font-family: 'Cairo'; }
        .rights { text-align: center; color: #555; font-size: 0.7rem; margin-top: 40px; font-family: 'Orbitron'; letter-spacing: 1px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; }
        .modal-content { background: #0d0d0d; width: 85%; max-width: 380px; margin: 60px auto; padding: 25px; border: 1px solid var(--neon); border-radius: 15px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align: center;">
        <h1 style="font-family: 'Orbitron'; color: #fff; margin-bottom: 0;">SENTINEL<span style="color: var(--neon);">-X</span></h1>
        <p style="color: #888; font-size: 0.75rem; letter-spacing: 2px;">SECURED BY @WXL_E</p>
    </header>

    <div class="sentinel-card" id="mainCard">
        <div class="rank-badge" id="rankName">ROOKIE</div>
        <span class="card-number" id="cardNumber">0000 0000 0000 0000</span>
        
        <div class="card-details">
            <div><small style="color:#666">HOLDER</small><br><span id="cardEmail">GUEST</span></div>
            <div style="text-align: right;"><small style="color:#666">SECURITY PIN</small><br><span id="cardPIN" class="pin-box">0000</span></div>
        </div>
        
        <div class="points-display" id="cardPoints">0</div>
        <center><small style="color: var(--neon); font-family: 'Orbitron';">CREDITS BALANCE</small></center>
    </div>

    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px;">
        <button class="main-btn" style="width: auto; padding: 10px 20px;" onclick="claimDaily()">🎁 شحن يومي</button>
        <button class="main-btn" style="width: auto; padding: 10px 20px; background:transparent; border:1px solid var(--neon); color:var(--neon);" onclick="shareRef()">🔗 دعوة الأصدقاء</button>
    </div>

    <div class="grid" id="productGrid"></div>
    
    <div class="rights">DEVELOPED BY BOUHSSOUN YASSER | @WXL_E</div>
</div>

<div id="paymentModal" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--neon); font-family: 'Orbitron';">GATEWAY</h3>
        <input type="text" id="botToken" placeholder="Bot Token">
        <input type="text" id="chatID" placeholder="Chat ID">
        <input type="password" id="checkPIN" placeholder="أدخل PIN البطاقة الموضح أعلاه">
        <button class="main-btn" id="finalBuyBtn">تأكيد العملية</button>
        <button onclick="closeModal()" style="background:none; color:#555; border:none; cursor:pointer; margin-top:10px;">إلغاء</button>
    </div>
</div>

<script>
    let user = JSON.parse(localStorage.getItem('sentinel_v4')) || null;

    if(!user) {
        let email = prompt("أدخل إيميلك لتفعيل بطاقة @WXL_E:");
        user = {
            email: (email || "USER").toUpperCase(),
            id: Array.from({length: 4}, () => Math.floor(1000 + Math.random() * 9000)).join(' '),
            pin: Math.floor(1000 + Math.random() * 9000), // هذا هو الكود PIN
            points: 200, daily: 0
        };
        save();
    }

    // نظام النقاط عبر الرابط
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('ref') && !localStorage.getItem('ref_done')) {
        user.points += 100;
        localStorage.setItem('ref_done', 'true');
        save();
        alert("🎁 حصلت على 100 نقطة هدية من الرابط!");
    }

    function save() { localStorage.setItem('sentinel_v4', JSON.stringify(user)); updateUI(); }
    
    function updateUI() {
        document.getElementById('cardEmail').innerText = user.email;
        document.getElementById('cardNumber').innerText = user.id;
        document.getElementById('cardPIN').innerText = user.pin; // عرض الـ PIN
        document.getElementById('cardPoints').innerText = user.points;
        let r = "ROOKIE";
        if(user.points > 1000) r = "ELITE"; else if(user.points > 500) r = "PRO";
        document.getElementById('rankName').innerText = r;
    }

    const products = [
        {id:1, name:"IPGRAM.py", price:100, file:"IPGRAM.py", img:"https://images.unsplash.com/photo-1558494949-ef010cbdcc51?w=400"},
        {id:2, name:"solx_wxle.py", price:250, file:"solx_wxle.py", img:"https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=400"},
        {id:3, name:"RSS.DDOS.V3.py", price:150, file:"RSS.DDOS.V3.py", img:"https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=400"},
        {id:4, name:"كورس الاختراق الشامل", price:600, file:"HACK_COURSE_URL", img:"https://images.unsplash.com/photo-1563986768609-322da13575f3?w=400", isCourse:true},
        {id:5, name:"كورس البرمجة الاحترافي", price:550, file:"DEV_COURSE_URL", img:"https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=400", isCourse:true},
        {id:6, name:"كورس التداول من 0", price:700, file:"TRADE_COURSE_URL", img:"https://images.unsplash.com/photo-1611974717483-9b910c0c9cd9?w=400", isCourse:true}
    ];

    let activeP = null;
    function openBuy(id) {
        activeP = products.find(p => p.id === id);
        if(user.points < activeP.price) return alert("نقاطك لا تكفي!");
        document.getElementById('paymentModal').style.display = "block";
    }

    function closeModal() { document.getElementById('paymentModal').style.display = "none"; }

    document.getElementById('finalBuyBtn').onclick = async function() {
        const pin = document.getElementById('checkPIN').value;
        const token = document.getElementById('botToken').value;
        const cid = document.getElementById('chatID').value;
        
        if(pin != user.pin) return alert("PIN غير صحيح! انظر للكود الأحمر في البطاقة.");

        user.points -= activeP.price;
        save();

        const text = `🚀 عملية شراء جديدة\n📦 المنتج: ${activeP.name}\n👤 المشتري: ${user.email}\n🔑 رابط/ملف: ${activeP.file}`;
        
        try {
            await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${cid}&text=${encodeURIComponent(text)}`);
            alert("✅ تم إرسال المنتج للبوت بنجاح!");
            closeModal();
        } catch(e) { alert("تأكد من إعدادات البوت (Token/ID)"); }
    }

    function claimDaily() {
        if(Date.now() - user.daily < 86400000) return alert("شحنت اليوم بالفعل!");
        user.points += 150; user.daily = Date.now(); save();
        alert("تمت إضافة 150 نقطة!");
    }

    function shareRef() {
        const cleanUrl = window.location.href.split('?')[0];
        const link = `${cleanUrl}?ref=${user.pin}`;
        navigator.clipboard.writeText(link);
        alert("تم نسخ رابط الدعوة! شاركه لجمع النقاط.");
    }

    const grid = document.getElementById('productGrid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="product-card">
                <img src="${p.img}" class="product-image">
                <div class="info">
                    <h3 style="margin:5px 0">${p.name}</h3>
                    <div style="color:var(--neon); font-family:'Orbitron'">${p.price} PTS</div>
                    <button class="main-btn" onclick="openBuy(${p.id})">شراء الآن</button>
                </div>
            </div>`;
    });

    updateUI();
</script>
</body>
</html>
